<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="opKeyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#A855F7" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="opGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <g filter="url(#opKeyGlow)">
    <!-- Key Head -->
    <polygon points="22,8 34,16 34,28 22,36 10,28 10,16" fill="url(#opGrad)" stroke="#FDF4FF" stroke-width="2.5"/>
    <circle cx="22" cy="22" r="6" fill="#3B0764" stroke="#F472B6" stroke-width="2"/>
    <polygon points="22,18 24,21 27,22 24,24 22,27 20,24 17,22 20,21" fill="#FFF"/>
    <!-- Shaft -->
    <rect x="28" y="27" width="28" height="6" transform="rotate(45 32 32)" fill="url(#opGrad)" stroke="#FDF4FF" stroke-width="1.8" rx="1.5"/>
    <!-- Teeth -->
    <rect x="44" y="38" width="7" height="5" transform="rotate(45 44 38)" fill="#F472B6" stroke="#FFF" stroke-width="1"/>
    <rect x="50" y="44" width="8" height="5" transform="rotate(45 50 44)" fill="#38BDF8" stroke="#FFF" stroke-width="1"/>
  </g>
  <!-- Sparkles -->
  <polygon points="12,8 14,11 17,12 14,13 13,16 11,13 8,12 11,11" fill="#FDF4FF"/>
  <polygon points="52,14 54,17 57,18 54,19 53,22 51,19 48,18 51,17" fill="#FDF4FF"/>
</svg>
