<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="lightningGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#38BDF8" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="tridentMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <!-- Main Shaft -->
  <line x1="12" y1="52" x2="38" y2="26" stroke="#D97706" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="14" y1="50" x2="36" y2="28" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
  <!-- Gold Bands -->
  <rect x="22" y="38" width="6" height="4" transform="rotate(-45 25 40)" fill="#F59E0B" rx="1"/>
  <!-- Trident Head -->
  <g filter="url(#lightningGlow)">
    <!-- Center Blade -->
    <path d="M42 22 L52 12 L50 20 L44 26 Z" fill="url(#tridentMetal)"/>
    <path d="M52 12 L48 24 L42 22 Z" fill="#67E8F9"/>
    <!-- Top Prong -->
    <path d="M38 18 L46 6 L44 14 L36 20 Z" fill="url(#tridentMetal)"/>
    <!-- Bottom Prong -->
    <path d="M46 26 L58 34 L50 32 L44 24 Z" fill="url(#tridentMetal)"/>
    <!-- Base Bracket -->
    <path d="M36 20 C38 24 40 26 44 24" stroke="#0891B2" stroke-width="3" fill="none"/>
  </g>
  <!-- Lightning Sparks -->
  <polygon points="56,8 58,12 62,13 59,15 60,18 56,15 53,16 55,13" fill="#E0F2FE"/>
  <polygon points="32,6 34,9 37,10 34,11 35,14 32,12 29,13 31,10" fill="#E0F2FE"/>
</svg>
