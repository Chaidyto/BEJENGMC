<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="moneyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#10B981" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <g filter="url(#moneyGlow)">
    <!-- Stack of Gold Coins Left -->
    <ellipse cx="20" cy="46" rx="12" ry="5" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="1.2"/>
    <ellipse cx="20" cy="41" rx="12" ry="5" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="1.2"/>
    <ellipse cx="20" cy="36" rx="12" ry="5" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="12" ry="5" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="1.2"/>
    
    <!-- Stack of Gold Coins Right -->
    <ellipse cx="44" cy="48" rx="11" ry="4.5" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="1.2"/>
    <ellipse cx="44" cy="43" rx="11" ry="4.5" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="1.2"/>
    <ellipse cx="44" cy="38" rx="11" ry="4.5" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="1.2"/>

    <!-- Central Glowing Emerald Crystal -->
    <polygon points="32,10 44,22 38,40 26,40 20,22" fill="url(#emeraldGrad)" stroke="#D1FAE5" stroke-width="2"/>
    <polygon points="32,10 38,22 32,38 26,22" fill="#34D399" opacity="0.6"/>
    <!-- Dollar sign overlay -->
    <text x="32" y="29" font-family="sans-serif" font-size="12" font-weight="900" fill="#FFF" text-anchor="middle" dominant-baseline="middle">$</text>
  </g>
  <!-- Sparkles -->
  <polygon points="12,18 14,21 17,22 14,23 13,26 11,23 8,22 11,21" fill="#FEF08A"/>
  <polygon points="52,22 54,25 57,26 54,27 53,30 51,27 48,26 51,25" fill="#A7F3D0"/>
</svg>
