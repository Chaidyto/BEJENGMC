<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="wolfSpawnerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#F59E0B" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g filter="url(#wolfSpawnerGlow)">
    <!-- Cage Box -->
    <rect x="8" y="8" width="48" height="48" rx="4" stroke="#475569" stroke-width="2.5" fill="#0B132B" fill-opacity="0.85"/>
    <!-- Iron Grid Bars -->
    <line x1="20" y1="8" x2="20" y2="56" stroke="#64748B" stroke-width="2"/>
    <line x1="32" y1="8" x2="32" y2="56" stroke="#64748B" stroke-width="2"/>
    <line x1="44" y1="8" x2="44" y2="56" stroke="#64748B" stroke-width="2"/>
    <line x1="8" y1="20" x2="56" y2="20" stroke="#64748B" stroke-width="2"/>
    <line x1="8" y1="32" x2="56" y2="32" stroke="#64748B" stroke-width="2"/>
    <line x1="8" y1="44" x2="56" y2="44" stroke="#64748B" stroke-width="2"/>

    <!-- Fiery core embers -->
    <circle cx="32" cy="32" r="14" fill="#F59E0B" fill-opacity="0.3"/>
    
    <!-- Wolf Silhouette inside -->
    <!-- Wolf head & snout -->
    <polygon points="26,24 24,18 28,21 36,21 40,18 38,24" fill="#E2E8F0"/>
    <polygon points="26,24 38,24 36,34 28,34" fill="#F8FAFC"/>
    <!-- Snout & Nose -->
    <rect x="29" y="30" width="6" height="6" fill="#CBD5E1"/>
    <rect x="31" y="33" width="2" height="2" fill="#0F172A"/>
    <!-- Eyes -->
    <rect x="28" y="26" width="2" height="2" fill="#EF4444"/>
    <rect x="34" y="26" width="2" height="2" fill="#EF4444"/>
    <!-- Wolf Body / Collar -->
    <rect x="27" y="35" width="10" height="3" fill="#DC2626"/>
  </g>
  <!-- Flame Sparks -->
  <circle cx="16" cy="14" r="1.5" fill="#F59E0B"/>
  <circle cx="48" cy="16" r="2" fill="#EF4444"/>
  <circle cx="46" cy="48" r="1.5" fill="#FBBF24"/>
  <circle cx="14" cy="46" r="2" fill="#F59E0B"/>
</svg>
