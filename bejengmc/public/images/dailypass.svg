<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="passGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="passGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <!-- Ticket Body -->
  <g filter="url(#passGlow)">
    <rect x="8" y="14" width="48" height="36" rx="5" fill="url(#passGrad)" stroke="#FEF08A" stroke-width="2"/>
    <!-- Notches -->
    <circle cx="8" cy="32" r="5" fill="#090D16"/>
    <circle cx="56" cy="32" r="5" fill="#090D16"/>
    <!-- Dashed separator -->
    <line x1="22" y1="16" x2="22" y2="48" stroke="#FEF08A" stroke-dasharray="3,3" stroke-width="1.5"/>
    <!-- Star icon -->
    <polygon points="38,22 40,28 46,28 41,32 43,38 38,34 33,38 35,32 30,28 36,28" fill="#FFFBEB" stroke="#FDE047" stroke-width="1"/>
    <!-- Clock / Calendar bars -->
    <rect x="13" y="24" width="5" height="16" rx="1.5" fill="#FEF08A" opacity="0.85"/>
  </g>
</svg>
