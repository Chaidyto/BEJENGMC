<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="fireGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#F97316" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Dark Interior -->
  <rect x="12" y="12" width="40" height="40" rx="3" fill="#0A0A0A"/>
  <!-- Internal Flame / Soul Vortex -->
  <g filter="url(#fireGlow)">
    <circle cx="32" cy="32" r="10" fill="#EA580C" opacity="0.8"/>
    <circle cx="32" cy="30" r="6" fill="#FACC15"/>
    <circle cx="32" cy="28" r="3" fill="#FFFFFF"/>
  </g>
  <!-- Iron Cage Grid -->
  <rect x="10" y="10" width="44" height="44" rx="3" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Horizontal bars -->
  <line x1="10" y1="22" x2="54" y2="22" stroke="#475569" stroke-width="2.5"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#64748B" stroke-width="2.5"/>
  <line x1="10" y1="42" x2="54" y2="42" stroke="#475569" stroke-width="2.5"/>
  <!-- Vertical bars -->
  <line x1="22" y1="10" x2="22" y2="54" stroke="#475569" stroke-width="2.5"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="#64748B" stroke-width="2.5"/>
  <line x1="42" y1="10" x2="42" y2="54" stroke="#475569" stroke-width="2.5"/>
  <!-- Corner studs -->
  <circle cx="12" cy="12" r="2" fill="#94A3B8"/>
  <circle cx="52" cy="12" r="2" fill="#94A3B8"/>
  <circle cx="12" cy="52" r="2" fill="#94A3B8"/>
  <circle cx="52" cy="52" r="2" fill="#94A3B8"/>
</svg>
