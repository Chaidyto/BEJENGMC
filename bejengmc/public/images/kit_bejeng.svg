<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="bejengKitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#38BDF8" flood-opacity="0.85"/>
    </filter>
    <linearGradient id="bejengChestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
  </defs>
  <g filter="url(#bejengKitGlow)">
    <!-- Chest Base -->
    <rect x="10" y="24" width="44" height="28" rx="4" fill="url(#bejengChestGrad)" stroke="#38BDF8" stroke-width="2"/>
    <!-- Chest Lid -->
    <rect x="8" y="16" width="48" height="12" rx="3" fill="#0EA5E9" stroke="#7DD3FC" stroke-width="2"/>
    <!-- Gold Trim Straps -->
    <rect x="18" y="16" width="4" height="36" fill="#F59E0B" stroke="#FDE047" stroke-width="0.75"/>
    <rect x="42" y="16" width="4" height="36" fill="#F59E0B" stroke="#FDE047" stroke-width="0.75"/>
    <!-- Diamond Latch -->
    <rect x="28" y="22" width="8" height="10" rx="1.5" fill="#38BDF8" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="32" cy="27" r="1.5" fill="#082F49"/>
  </g>
  <!-- Diamond Sparkles -->
  <polygon points="12,12 14,15 17,16 14,17 13,20 11,17 8,16 11,15" fill="#E0F2FE"/>
  <polygon points="50,10 52,13 55,14 52,15 51,18 49,15 46,14 49,13" fill="#E0F2FE"/>
</svg>
