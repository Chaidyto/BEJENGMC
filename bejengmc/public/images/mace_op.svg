<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="maceGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#38BDF8" flood-opacity="0.85"/>
    </filter>
    <linearGradient id="maceHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <g filter="url(#maceGlow)">
    <!-- Breeze Rod Handle -->
    <line x1="16" y1="48" x2="38" y2="26" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="16" y1="48" x2="38" y2="26" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3"/>
    <circle cx="16" cy="48" r="3" fill="#D97706" stroke="#FEF08A" stroke-width="1"/>
    
    <!-- Wind Swirls around handle -->
    <path d="M22 44 C26 40 28 36 24 34" stroke="#67E8F9" stroke-width="1.8" fill="none" opacity="0.8"/>
    <path d="M30 36 C34 32 36 28 32 26" stroke="#67E8F9" stroke-width="1.8" fill="none" opacity="0.8"/>

    <!-- Heavy Core Mace Head -->
    <rect x="34" y="10" width="20" height="20" rx="3" transform="rotate(45 44 20)" fill="url(#maceHead)" stroke="#94A3B8" stroke-width="2"/>
    <!-- Heavy Core Inset & Studs -->
    <rect x="38" y="14" width="12" height="12" rx="1.5" transform="rotate(45 44 20)" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="44" cy="20" r="3" fill="#38BDF8" filter="url(#maceGlow)"/>
  </g>
  <!-- Impact / Wind Sparkles -->
  <polygon points="56,8 58,11 61,12 58,13 57,16 55,13 52,12 55,11" fill="#E0F2FE"/>
  <polygon points="32,6 33,8 35,9 33,10 32,12 31,10 29,9 31,8" fill="#E0F2FE"/>
</svg>
